name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache compiled assets
        uses: actions/cache@v4
        with:
          path: compiled
          key: ${{ runner.os }}-compiled-${{ hashFiles('scripts/build-images.js', 'src/_data/globalAllPhotos.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-compiled-

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run compile && npm run build
        env:
          PATH_PREFIX: "/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
